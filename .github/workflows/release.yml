name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. 1.0.0)"
        type: string
        required: true
      prerelease:
        description: "Whether this is a prerelease"
        type: boolean
        default: false
        required: false
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out MaxSpeed Editor
        uses: actions/checkout@v7

      - name: Check out modernized Gradle JOSM plugin
        env:
          GH_TOKEN: ${{ secrets.GRADLE_JOSM_PLUGIN_TOKEN }}
        run: >-
          gh repo clone gabortim/gradle-josm-plugin
          ../gradle-josm-plugin
          -- --depth 1 --branch gradle-modernization

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build
        env:
          RELEASE_VERSION: ${{ inputs.tag_name || github.ref_name }}
        run: ./gradlew clean test jar -PreleaseVersion="$RELEASE_VERSION"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: build/libs/*.jar
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
